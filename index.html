<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Terminal v2.1</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c1017; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; transition: background 0.4s ease; }
        
        /* Obrazovka 1: Zadávání částky */
        #setupScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .setup-title { font-size: 16px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .amount-display { font-size: 54px; font-weight: bold; margin-bottom: 30px; color: #58a6ff; }
        
        /* Klávesnice */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 80%; max-width: 280px; }
        .key { background: #21262d; border: 1px solid #30363d; border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; cursor: pointer; transition: active 0.1s; -webkit-tap-highlight-color: transparent; }
        .key:active { background: #30363d; }
        .key.btn-ok { background: #238636; border-color: #2ea44f; border-radius: 12px; width: auto; grid-column: span 3; height: 55px; margin-top: 10px; }
        .key.btn-ok:active { background: #2ea44f; }
        
        /* Obrazovka 2: Samotný Terminál */
        #terminalScreen { display: none; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 90vh; box-sizing: border-box; padding: 40px 20px; }
        .terminal-amount { font-size: 48px; font-weight: 800; letter-spacing: -1px; margin-top: 20px; }
        
        /* Bezdotyková animace vln */
        .wave-container { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; margin: 30px 0; }
        .wave-icon { font-size: 70px; z-index: 2; }
        .wave { position: absolute; border: 4px solid #58a6ff; border-radius: 50%; width: 100%; height: 100%; animation: pulse 2s infinite ease-out; opacity: 0; }
        .wave2 { animation-delay: 0.6s; }
        .wave3 { animation-delay: 1.2s; }
        
        .status-text { font-size: 18px; font-weight: 600; text-align: center; color: #c9d1d9; min-height: 50px; }
        
        /* Spodní branding loga karet */
        .logos { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; opacity: 0.6; }
        .logo-text { font-size: 20px; font-weight: bold; font-style: italic; letter-spacing: -1px; }
        .visa-text { color: #005792; }
        .mc-text { color: #eb001b; }

        /* Stavy po schválení platby */
        .success-bg { background: #112b1a !important; }
        .success-text { color: #3fb950 !important; }
        .success-wave { border-color: #3fb950 !important; animation: none !important; opacity: 1 !important; transform: scale(1.1); }

        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. OBRAZOVKA: ZADÁNÍ ČÁSTKY -->
    <div id="setupScreen">
        <div class="setup-title">Zadejte částku</div>
        <div class="amount-display"><span id="typedAmount">0</span> Kč</div>
        <div class="keypad">
            <div class="key" onclick="pressNum(1)">1</div>
            <div class="key" onclick="pressNum(2)">2</div>
            <div class="key" onclick="pressNum(3)">3</div>
            <div class="key" onclick="pressNum(4)">4</div>
            <div class="key" onclick="pressNum(5)">5</div>
            <div class="key" onclick="pressNum(6)">6</div>
            <div class="key" onclick="pressNum(7)">7</div>
            <div class="key" onclick="pressNum(8)">8</div>
            <div class="key" onclick="pressNum(9)">9</div>
            <div class="key" style="font-size:16px; border-radius:12px;" onclick="pressClear()">Smazat</div>
            <div class="key" onclick="pressNum(0)">0</div>
            <div class="key" style="font-size:16px; border-radius:12px;" onclick="pressNum('00')">00</div>
            <div class="key btn-ok" onclick="confirmAmount()">POTVRDIT (OK)</div>
        </div>
    </div>

    <!-- 2. OBRAZOVKA: TERMINÁL ČEKAJÍCÍ NA PLATBU -->
    <div id="terminalScreen" onclick="triggerPayment()">
        <div id="finalAmount" class="terminal-amount">0,00 Kč</div>
        
        <div class="wave-container">
            <div id="w1" class="wave"></div>
            <div id="w2" class="wave wave2"></div>
            <div id="w3" class="wave wave3"></div>
            <div id="termIcon" class="wave-icon">📶</div>
        </div>

        <div id="statusLabel" class="status-text">Prosím, přiložte kartu<br>nebo mobilní telefon</div>

        <!-- Čistě kódovaná loga, aby se načítala okamžitě a bez internetu -->
        <div class="logos">
            <span class="logo-text visa-text">VISA</span>
            <span class="logo-text mc-text">mastercard</span>
        </div>
    </div>

    <script>
        let currentAmount = "";

        function pressNum(num) {
            if (currentAmount === "" && (num === 0 || num === '00')) return;
            if (currentAmount.length < 7) {
                currentAmount += num;
                document.getElementById("typedAmount").innerText = currentAmount;
            }
        }

        function pressClear() {
            currentAmount = "";
            document.getElementById("typedAmount").innerText = "0";
        }

        function confirmAmount() {
            if (currentAmount === "" || currentAmount === "0") return;
            
            document.getElementById("finalAmount").innerText = parseInt(currentAmount).toLocaleString('cs-CZ') + ",00 Kč";
            
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("terminalScreen").style.display = "flex";
        }

        function pipnuti() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(1450, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.18);
        }

        let isPaid = false;
        function triggerPayment() {
            if (isPaid) return;
            isPaid = true;

            document.getElementById("statusLabel").innerHTML = "Čtení karty...<br>Nevzdalujte kartu";
            
            setTimeout(() => {
                pipnuti();
                document.body.classList.add("success-bg");
                document.getElementById("statusLabel").classList.add("success-text");
                document.getElementById("statusLabel").innerHTML = "PLATBA SCHVÁLENA<br>Děkujeme";
                document.getElementById("termIcon").innerText = "✓";
                
                document.getElementById("w1").classList.add("success-wave");
                document.getElementById("w2").style.display = "none";
                document.getElementById("w3").style.display = "none";
            }, 1200);
        }
    </script>
</body>
</html>
