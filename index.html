<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Terminal v3.0</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; transition: background 0.3s ease; }
        
        /* Obrazovka 1: Zadávání částky */
        #setupScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .setup-title { font-size: 15px; color: #8b949e; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; font-weight: 500; }
        .amount-display { font-size: 56px; font-weight: bold; margin-bottom: 35px; color: #58a6ff; font-variant-numeric: tabular-nums; }
        
        /* Klávesnice */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 85%; max-width: 290px; }
        .key { background: #161b22; border: 1px solid #30363d; border-radius: 50%; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; cursor: pointer; transition: background 0.1s; -webkit-tap-highlight-color: transparent; }
        .key:active { background: #30363d; }
        .key.btn-ok { background: #238636; border-color: #2ea44f; border-radius: 14px; width: auto; grid-column: span 3; height: 58px; margin-top: 10px; font-size: 18px; letter-spacing: 0.5px; }
        .key.btn-ok:active { background: #2ea44f; }
        
        /* Obrazovka 2: Samotný Terminál */
        #terminalScreen { display: none; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 85vh; box-sizing: border-box; padding: 30px 20px; }
        .terminal-amount { font-size: 52px; font-weight: 800; letter-spacing: -1px; margin-top: 15px; font-variant-numeric: tabular-nums; }
        
        /* Bezdotyková animace vln */
        .wave-container { position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        .wave-icon { font-size: 65px; z-index: 2; color: #58a6ff; transition: color 0.3s; }
        .wave { position: absolute; border: 4px solid #58a6ff; border-radius: 50%; width: 100%; height: 100%; animation: pulse 2s infinite ease-out; opacity: 0; }
        .wave2 { animation-delay: 0.6s; }
        .wave3 { animation-delay: 1.2s; }
        
        .status-text { font-size: 19px; font-weight: 600; text-align: center; color: #c9d1d9; min-height: 55px; line-height: 1.5; }
        
        /* Spodní autentické VISA logo */
        .logos { display: flex; justify-content: center; width: 100%; margin-bottom: 10px; }
        .visa-logo { height: 32px; object-fit: contain; opacity: 0.85; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)); }

        /* Stavy po schválení platby */
        .success-bg { background: #0e2a18 !important; }
        .success-text { color: #3fb950 !important; }
        .success-wave { border-color: #3fb950 !important; animation: none !important; opacity: 1 !important; transform: scale(1.1); }

        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 0; }
            50% { opacity: 0.35; }
            100% { transform: scale(1.35); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. OBRAZOVKA: ZADÁNÍ ČÁSTKY -->
    <div id="setupScreen">
        <div class="setup-title">Částka k úhradě</div>
        <div class="amount-display"><span id="typedAmount">0</span> Kč</div>
        <div class="keypad">
            <div class="key" onclick="pressNum(1)">1</div>
            <div class="key" onclick="pressNum(2)">2</div>
            <div class="key" onclick="pressNum(3)">3</div>
            <div class="key" onclick="pressNum(4)">4</div>
            <div class="key" onclick="pressNum(5)">5</div>
            <div class="key" onclick="pressNum(6)">6</div>
            <div class="key" onclick="pressNum(7)">7</div>
            <div class="key" onclick="pressNum(8)">8</div>
            <div class="key" onclick="pressNum(9)">9</div>
            <div class="key" style="font-size:15px; border-radius:12px; background: #21262d;" onclick="pressClear()">Smazat</div>
            <div class="key" onclick="pressNum(0)">0</div>
            <div class="key" style="font-size:15px; border-radius:12px; background: #21262d;" onclick="pressNum('00')">00</div>
            <div class="key btn-ok" onclick="confirmAmount()">POTVRDIT</div>
        </div>
    </div>

    <!-- 2. OBRAZOVKA: TERMINÁL ČEKAJÍCÍ NA PLATBU -->
    <div id="terminalScreen" onclick="triggerPayment()">
        <div id="finalAmount" class="terminal-amount">0,00 Kč</div>
        
        <div class="wave-container">
            <div id="w1" class="wave"></div>
            <div id="w2" class="wave wave2"></div>
            <div id="w3" class="wave wave3"></div>
            <div id="termIcon" class="wave-icon">📶</div>
        </div>

        <div id="statusLabel" class="status-text">Prosím, přiložte kartu<br>nebo mobilní zařízení</div>

        <!-- Oficiální čisté bílé VISA logo centrované dole -->
        <div class="logos">
            <img class="visa-logo" src="https://wikimedia.org" alt="Visa">
        </div>
    </div>

    <script>
        let currentAmount = "";

        function pressNum(num) {
            if (currentAmount === "" && (num === 0 || num === '00')) return;
            if (currentAmount.length < 7) {
                currentAmount += num;
                document.getElementById("typedAmount").innerText = parseInt(currentAmount).toLocaleString('cs-CZ');
            }
        }

        function pressClear() {
            currentAmount = "";
            document.getElementById("typedAmount").innerText = "0";
        }

        function confirmAmount() {
            if (currentAmount === "" || currentAmount === "0") return;
            
            document.getElementById("finalAmount").innerText = parseInt(currentAmount).toLocaleString('cs-CZ') + ",00 Kč";
            
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("terminalScreen").style.display = "flex";
        }

        // Vylepšený audio systém pro simulaci reálného hardwaru
        function hrajTon(frekvence, delka, casOdstartovani) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frekvence, audioCtx.currentTime + casOdstartovani);
            
            // Čistý náběh a doběh zvuku aby to nepraskalo a znělo to jako reproduktor terminálu
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime + casOdstartovani);
            gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + casOdstartovani + 0.02);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime + casOdstartovani + delka - 0.02);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + casOdstartovani + delka);
            
            oscillator.start(audioCtx.currentTime + casOdstartovani);
            oscillator.stop(audioCtx.currentTime + casOdstartovani + delka);
        }

        let isPaid = false;
        function triggerPayment() {
            if (isPaid) return;
            isPaid = true;

            document.getElementById("statusLabel").innerHTML = "Čtení karty...<br>Nevzdalujte kartu";
            
            // 1. Zvuk: Krátké dvojité pípnutí ihned při detekci (přiložení)
            hrajTon(1200, 0.05, 0);       // První rychlé pípnutí
            hrajTon(1200, 0.05, 0.08);    // Druhé rychlé pípnutí o 80ms později
            
            // 2. Krok: Zpracování a finální schválení s dlouhým klasickým tónem
            setTimeout(() => {
                hrajTon(1450, 0.22, 0);   // Dlouhý finální tón úspěšné platby (220ms)
                
                document.body.classList.add("success-bg");
                document.getElementById("statusLabel").classList.add("success-text");
                document.getElementById("statusLabel").innerHTML = "PLATBA SCHVÁLENA<br>Děkujeme";
                document.getElementById("termIcon").innerText = "✓";
                document.getElementById("termIcon").style.color = "#3fb950";
                
                document.getElementById("w1").classList.add("success-wave");
                document.getElementById("w2").style.display = "none";
                document.getElementById("w3").style.display = "none";
            }, 1100); // Čas zpracování mezi přiložením a schválením
        }
    </script>
</body>
</html>
